source:
  name: 中国石化物资招标投标网
  baseUrl: https://bidding.sinopec.com
settings:
  # 443 连接超时（本机网络不可达，2026-10 实测），需换出口/代理后再评估
  enabled: false
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: https://bidding.sinopec.com/bidding/bidNoticeList.html
    url: https://bidding.sinopec.com/bidding/bidNoticeList.html
    parse:
      itemSelector: table.list_table tr:gt(0)
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: td:eq(3)
          attr: text
          regex: '\d{4}-\d{2}-\d{2}(?:\s+\d{1,2}:\d{1,2}(?::\d{1,2})?)?'
    detail:
      contentSelector: div.article-content
      removeSelector: script, style
