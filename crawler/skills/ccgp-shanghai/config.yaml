source:
  name: 上海市政府采购网
  baseUrl: http://www.zfcg.sh.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.zfcg.sh.gov.cn/cms/channel/purchase_notice/index.htm
    url: http://www.zfcg.sh.gov.cn/cms/channel/purchase_notice/index.htm
    parse:
      itemSelector: ul.newsList > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span.time
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "31"
    detail:
      contentSelector: div.content_detail
      removeSelector: script, style
