source:
  name: 湖南省政府采购网
  baseUrl: http://www.ccgp-hunan.gov.cn
settings:
  requestDelayMs: 1200
  timeoutMs: 20000
  retries: 2
  maxPages: 2
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: json
    request:
      method: POST
      url: http://www.ccgp-hunan.gov.cn/portal/searchHome
      headers:
        Content-Type: application/json;charset=UTF-8
      json:
        code: 160-396330
        pageSize: 15
        pageNo: "{page}"
    startPage: 1
    maxPages: 2
    parse:
      itemsPath: "result.data.children"
      fields:
        title: "title"
        url: "http://www.ccgp-hunan.gov.cn/portal/detail?articleId={articleId}"
        date: "pubDate"
        purchaser: "purchaseName"
        province:
          const: "43"
        city: "districtName"
    detail:
      contentSelector: "#template-center-mark, .tb-fidelity-root, body"
