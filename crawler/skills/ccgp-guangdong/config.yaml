source:
  name: 广东省政府采购网
  baseUrl: https://gdgpo.czt.gd.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: https://gdgpo.czt.gd.gov.cn/freecms/rest/v1/notice/selectNoticeInfoList
    url: https://gdgpo.czt.gd.gov.cn/freecms/rest/v1/notice/selectNoticeInfoList
    parse:
      itemSelector: ul.m-list > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span.date
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "44"
    detail:
      contentSelector: div.notice-detail
      removeSelector: script, style
