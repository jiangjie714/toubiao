source:
  name: 广东省政府采购网
  baseUrl: https://gdgpo.czt.gd.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 2
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: json
    request:
      method: GET
      url: "https://gdgpo.czt.gd.gov.cn/gpcms/rest/web/v2/info/selectInfoForIndex?siteId=cd64e06a-21a7-4620-aebc-0576bab7e07a&channel=fca71be5-fc0c-45db-96af-f513e9abda9d,95ff31f3-a1af-4bc4-b1a2-54c894476193&currPage={page}&pageSize=15"
    startPage: 1
    maxPages: 2
    parse:
      itemsPath: "data.rows"
      fields:
        title: "title"
        # sourceUrl 用人类可读的详情页，而非 JSON 接口
        url: "https://gdgpo.czt.gd.gov.cn/maincms-web/articleDetail?type=notice&id={id}"
        date: "noticeTime"
        # 详情接口 getInfoById 只返回元数据（无正文），列表行的 description
        # 是正文摘要（实测截断在 500 字），比抓 JSON 当正文更可用
        hint: "description"
        purchaser: "purchaser"
        agency: "agency"
        province:
          const: "44"
        city: "regionName"
    # 无 detail：content 取列表 description 摘要

