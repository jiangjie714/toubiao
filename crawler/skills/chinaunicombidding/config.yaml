source:
  name: 中国联通采购与招标网
  baseUrl: http://www.chinaunicombidding.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.chinaunicombidding.cn/jsp/cninfo/listProcurementNotice.jsp
    url: http://www.chinaunicombidding.cn/jsp/cninfo/listProcurementNotice.jsp
    parse:
      itemSelector: table.noticeTable tr:gt(0)
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: td:eq(2)
          attr: text
          regex: \d{4}-\d{2}-\d{2}
    detail:
      contentSelector: div.notice-box
      removeSelector: script, style
