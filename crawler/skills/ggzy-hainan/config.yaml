source:
  name: 海南省公共资源交易服务平台
  baseUrl: https://ggzy.hainan.gov.cn

settings:
  requestDelayMs: 1500
  timeoutMs: 25000
  retries: 2
  maxPages: 3
  scheduleCron: "10 */2 * * *"
  headers:
    Content-Type: application/json;charset=UTF-8
    Accept: application/json, text/plain, */*
    Referer: https://ggzy.hainan.gov.cn/ggzyjy/jyxx/003001/003001002/jyxx_list.html

# 列表走站点全文检索接口（common.js 的 fullsearchUrl），所有频道共用同一个端点，
# 靠 condition[].equal 的 categorynum 区分类目（前缀匹配），pn 是行偏移量。
# 注意 fields 必须传 "title"，否则接口返回空 records。
lists:
  # ── 工程建设 003001 ──
  - type: INTENTION
    mode: json
    request:
      method: POST
      url: https://ggzy.hainan.gov.cn/inteligentsearch/rest/esinteligentsearch/getFullTextDataNew
      body: '{"token":"","pn":{page*10-10},"rn":10,"sdt":"","edt":"","wd":"","inc_wd":"","exc_wd":"","fields":"title","cnum":"001","sort":"{\"webdate\":\"0\"}","ssort":"title","cl":200,"terminal":"","condition":[{"fieldName":"categorynum","equal":"003001001","notEqual":null,"equalList":null,"notEqualList":null,"isLike":true,"likeType":2}],"time":[{"fieldName":"webdate","startTime":"1970-01-01 00:00:00","endTime":"2999-12-31 23:59:59"}],"highlights":"title","statistics":null,"unionCondition":null,"accuracy":"","noParticiple":"1","searchRange":[],"isBusiness":"1"}'
    parse:
      itemsPath: result.records
      fields:
        title: titlenew
        url: linkurl
        date: webdate
        province:
          const: "46"
        city: xiaquname
        hint: categoryname
    detail:
      contentSelector: .article-info.jyxx-info
      removeSelector: script, style

  - type: NOTICE
