source:
  name: 福建省政府采购网
  baseUrl: http://zfcg.czt.fujian.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://zfcg.czt.fujian.gov.cn/notice/index.htm
    url: http://zfcg.czt.fujian.gov.cn/notice/index.htm
    parse:
      itemSelector: ul.list-group > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "35"
    detail:
      contentSelector: div.content
      removeSelector: script, style
