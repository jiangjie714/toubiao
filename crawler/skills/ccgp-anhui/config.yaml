source:
  name: 安徽省政府采购网
  baseUrl: http://www.ccgp-anhui.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.ccgp-anhui.gov.cn/cms/channel/purchase_notice/index.htm
    url: http://www.ccgp-anhui.gov.cn/cms/channel/purchase_notice/index.htm
    parse:
      itemSelector: ul.line_list > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "34"
    detail:
      contentSelector: div.detail_con
      removeSelector: script, style
