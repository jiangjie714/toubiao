source:
  name: 安徽省政府采购网
  baseUrl: https://www.ccgp-anhui.gov.cn
settings:
  requestDelayMs: 1200
  timeoutMs: 20000
  retries: 2
  maxPages: 2
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: json
    request:
      method: POST
      url: https://www.ccgp-anhui.gov.cn/front/search/category
      headers:
        Content-Type: application/json;charset=UTF-8
      json:
        pageNo: "{page}"
        pageSize: 15
        categoryCode: ZcyAnnouncement
    startPage: 1
    maxPages: 2
    parse:
      itemsPath: "hits.hits"
      fields:
        title: "_source.title"
        url: "https://www.ccgp-anhui.gov.cn/portal/detail?articleId={_source.articleId}"
        date: "_source.publishDate"
        purchaser: "_source.author"
        province:
          const: "34"
        city: "_source.districtName"
    detail:
      contentSelector: "#template-center-mark, .tb-fidelity-root, body"
