source:
  name: 四川省政府采购网
  baseUrl: http://www.ccgp-sichuan.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.ccgp-sichuan.gov.cn/view/staticpags/shiji_gkzb/index.html
    url: http://www.ccgp-sichuan.gov.cn/view/staticpags/shiji_gkzb/index.html
    parse:
      itemSelector: ul.info-list > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span.date
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "51"
    detail:
      contentSelector: div.con-detail
      removeSelector: script, style
