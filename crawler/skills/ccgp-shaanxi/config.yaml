source:
  name: 陕西省政府采购网
  baseUrl: http://www.ccgp-shaanxi.gov.cn
settings:
  # 现配置抓到的是首页新闻轮播；真实列表接口 notice/selectInfoMoreChannel.do 需 RSA 签名头
  enabled: false
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.ccgp-shaanxi.gov.cn/
    url: http://www.ccgp-shaanxi.gov.cn/
    parse:
      itemSelector: a.ckxq
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: a
          attr: text
          regex: '\d{4}-\d{2}-\d{2}'
        province:
          const: "61"
    detail:
      contentSelector: .content, body
      removeSelector: script, style
