source:
  name: 陕西省政府采购网
  baseUrl: http://www.ccgp-shaanxi.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.ccgp-shaanxi.gov.cn/notice/noticeaframe.do
    url: http://www.ccgp-shaanxi.gov.cn/notice/noticeaframe.do
    parse:
      itemSelector: ul.newsList > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span.time
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "61"
    detail:
      contentSelector: div.notice-detail
      removeSelector: script, style
