source:
  name: 江苏省政府采购网
  baseUrl: http://www.ccgp-jiangsu.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.ccgp-jiangsu.gov.cn/
    url: http://www.ccgp-jiangsu.gov.cn/
    parse:
      itemSelector: table.notice_tableBox tr:has(a)
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: td:last-child
          attr: text
          regex: '\d{4}-\d{2}-\d{2}'
        province:
          const: "32"
    detail:
      contentSelector: div.article_content, .content, body
      removeSelector: script, style
