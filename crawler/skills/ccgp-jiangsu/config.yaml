source:
  name: 江苏省政府采购网
  baseUrl: http://www.ccgp-jiangsu.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.ccgp-jiangsu.gov.cn/
    url: http://www.ccgp-jiangsu.gov.cn/
    parse:
      itemSelector: table.notice_tableBox tr:has(a)
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: td:last-child
          attr: text
          regex: '\d{4}-\d{2}-\d{2}'
        province:
          const: "32"
    detail:
      # 详情壳页 details.html?gglb=…&ggid=… 的正文是空模板，由 JS 回填；
      # 数据源为 relevantCgggGetById.jsp（GET 可用，返回 JSON 的 data.content 富文本）
      urlTemplate: "http://www.ccgp-jiangsu.gov.cn/pss/jsp/relevantCgggGetById.jsp?ggid={query:ggid}&gglb={query:gglb}"
      contentSelector: body
      removeSelector: script, style
