source:
  name: 中国中铁采购电子商务平台
  baseUrl: https://www.crecgec.com
settings:
  # 列表可达，但详情是 eproport.crecgec.com 的 SPA，需 projectId 调接口，正文 0 字
  enabled: false
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: https://www.crecgec.com/
    url: https://www.crecgec.com/
    parse:
      itemSelector: div.luban-notice-row
      fields:
        title:
          selector: a.name
          attr: title
        url:
          selector: a.name
          attr: href
        date:
          selector: div.date
          attr: text
          regex: '\d{4}-\d{2}-\d{2}'
    detail:
      contentSelector: ".tb-fidelity-root, .content, body"
      removeSelector: script, style
