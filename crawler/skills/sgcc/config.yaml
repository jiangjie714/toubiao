source:
  name: 国家电网新一代电子商务平台
  baseUrl: https://ecp.sgcc.com.cn
settings:
  # 电子商务平台为 SPA + hash 路由，静态抓取拿不到列表
  enabled: false
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: https://ecp.sgcc.com.cn/ecp2.0/portal/#/doc/doci-win/2018060571151651_2018060501171107
    url: https://ecp.sgcc.com.cn/ecp2.0/portal/#/doc/doci-win/2018060571151651_2018060501171107
    parse:
      itemSelector: div.el-table__row
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: td:eq(3)
          attr: text
          regex: '\d{4}-\d{2}-\d{2}(?:\s+\d{1,2}:\d{1,2}(?::\d{1,2})?)?'
    detail:
      contentSelector: div.detail-main
      removeSelector: script, style
