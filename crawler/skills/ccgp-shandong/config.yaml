source:
  name: 山东省政府采购网
  baseUrl: http://www.ccgp-shandong.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.ccgp-shandong.gov.cn/sdgp2017/site/channel__12.html
    url: http://www.ccgp-shandong.gov.cn/sdgp2017/site/channel__12.html
    parse:
      itemSelector: ul.list_news > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span.date
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "37"
    detail:
      contentSelector: div.detail_content
      removeSelector: script, style
