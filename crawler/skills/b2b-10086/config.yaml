source:
  name: 中国移动采购与招标网
  baseUrl: https://b2b.10086.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: https://b2b.10086.cn/b2b/main/listVendorsNoticeResult.html
    url: https://b2b.10086.cn/b2b/main/listVendorsNoticeResult.html
    parse:
      itemSelector: table.notice-table tr:gt(0)
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: td:last-child
          attr: text
          regex: \d{4}-\d{2}-\d{2}
    detail:
      contentSelector: div.notice-content
      removeSelector: script, style
