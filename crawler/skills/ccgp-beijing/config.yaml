source:
  name: 北京市政府采购网
  baseUrl: http://www.ccgp-beijing.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://www.ccgp-beijing.gov.cn/xxgg/sjzfcggg/
    url: http://www.ccgp-beijing.gov.cn/xxgg/sjzfcggg/
    parse:
      itemSelector: ul.listBox > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "11"
    detail:
      contentSelector: div.articleBox
      removeSelector: script, style
