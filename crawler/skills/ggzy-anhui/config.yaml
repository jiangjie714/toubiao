        headers:
          X-Requested-With: XMLHttpRequest
          Referer: "{url}"
        form:
          type: pbjg
          bulletinNature: "{query:bulletinNature}"
          guid: "{query:guid}"
          statusGuid: ""

  - type: RESULT
