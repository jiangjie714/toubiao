source:
  name: 浙江省政府采购网
  baseUrl: http://zfcg.czt.zj.gov.cn
settings:
  requestDelayMs: 1500
  timeoutMs: 20000
  retries: 2
  maxPages: 1
  scheduleCron: 0 */2 * * *
lists:
  - type: NOTICE
    mode: html
    firstPageUrl: http://zfcg.czt.zj.gov.cn/innerUsed_noticeList/index.html
    url: http://zfcg.czt.zj.gov.cn/innerUsed_noticeList/index.html
    parse:
      itemSelector: ul.notice-list > li
      fields:
        title:
          selector: a
          attr: text
        url:
          selector: a
          attr: href
        date:
          selector: span.time
          attr: text
          regex: \d{4}-\d{2}-\d{2}
        province:
          const: "33"
    detail:
      contentSelector: div.notice-content
      removeSelector: script, style
