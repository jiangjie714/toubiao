services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: toubiao
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-toubiao_db_pass_2026}
      POSTGRES_DB: toubiao
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toubiao"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: toubiao-app:latest
    restart: always
    environment:
      DATABASE_URL: postgresql://toubiao:${POSTGRES_PASSWORD:-toubiao_db_pass_2026}@postgres:5432/toubiao?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-bx7f3a9c2e1d84b6f0a5c3e7d9b1f4a2c6e8d0b3f5a7c9e1d3f5b7a9c1e3f5d7b}
      APP_URL: ${APP_URL:-http://124.220.98.81:3000}
      NODE_ENV: production
      RUN_DB_PUSH: "true"
      RUN_DB_SEED: "true"
      COMPANY_NAME: ${COMPANY_NAME:-北京云尖字节信息科技有限公司}
      COMPANY_BANK_NAME: ${COMPANY_BANK_NAME:-中国工商银行股份有限公司紫竹院支行}
      COMPANY_BANK_ACCOUNT: ${COMPANY_BANK_ACCOUNT:-0200007609200202973}
      COMPANY_BANK_BRANCH_CODE: ${COMPANY_BANK_BRANCH_CODE:-102100000763}
      COMPANY_TAX_NUMBER: ${COMPANY_TAX_NUMBER:-91110108MA017XYZ88}
    ports:
      - "0.0.0.0:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  push-worker:
    image: toubiao-app:latest
    restart: always
    command: ["npm", "run", "push:worker"]
    environment:
      DATABASE_URL: postgresql://toubiao:${POSTGRES_PASSWORD:-toubiao_db_pass_2026}@postgres:5432/toubiao?schema=public
      APP_URL: ${APP_URL:-http://124.220.98.81:3000}
      PUSH_CRON: ${PUSH_CRON:-0 8 * * *}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

  crawler-worker:
    image: toubiao-app:latest
    restart: always
    command: ["npm", "run", "crawl:worker"]
    environment:
      DATABASE_URL: postgresql://toubiao:${POSTGRES_PASSWORD:-toubiao_db_pass_2026}@postgres:5432/toubiao?schema=public
      NODE_ENV: production
      CRAWL_CRON: ${CRAWL_CRON:-0 */2 * * *}
    volumes:
      - storage-data:/app/.data/storage
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
